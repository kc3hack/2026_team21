  - apps/**/*

catalog:
  '@biomejs/biome': 2.3.13
  '@tailwindcss/postcss': ^4
  '@types/node': ^20.19.33
  '@types/react': ^19
  '@types/react-dom': ^19
  babel-plugin-react-compiler: 1.0.0
  next: 16.1.6
  npm-run-all2: 8.0.4
  react: 19.2.3
  react-dom: 19.2.3
  tailwindcss: ^4
  typescript: ^5
  valibot: ^1.2.0
  vitest: ^4.0.18

catalogMode: strict

cleanupUnusedCatalogs: true

