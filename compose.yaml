services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: example
      POSTGRES_USER: example
      POSTGRES_PASSWORD: example
      TZ: Asia/Tokyo
    volumes:
      - ./tmp/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U example"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 1s
